services:
  turn:
    image: coturn/coturn:4.6.3
    restart: unless-stopped
    network_mode: host
    command:
      - --no-cli
      - --log-file=stdout
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SHARED_SECRET:?Set TURN_SHARED_SECRET}
      - --realm=${TURN_REALM:?Set TURN_REALM}
      - --listening-ip=0.0.0.0
      - --external-ip=${TURN_EXTERNAL_IP:?Set TURN_EXTERNAL_IP}
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --no-tls
      - --no-dtls
